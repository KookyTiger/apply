<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Apply Agent</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1c1c1a; --muted: #6b6b66; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ececea; --muted: #9a9a95; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 0 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { text-align: center; max-width: 28rem; }
  p { margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <p id="msg">Opening Apply Agent…</p>
  <p class="muted" id="alt"></p>
</main>
<script>
// The app runs on Kay's Mac and its public link changes when the tunnel restarts; the app writes the current
// one to link.json, and this page forwards there (fetched fresh every time, never from a cache).
fetch("link.json?t=" + Date.now(), { cache: "no-store" })
  .then(function (r) { return r.json(); })
  .then(function (j) {
    if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/.test(j.url || "")) throw new Error("no link");
    var a = document.createElement("a");
    a.href = j.url; a.textContent = "open it here";
    var alt = document.getElementById("alt");
    alt.append("If nothing happens, ", a, ".");
    location.replace(j.url);
  })
  .catch(function () {
    document.getElementById("msg").textContent = "Apply Agent isn't reachable right now (the Mac may be asleep or restarting). Try again in a minute.";
  });
</script>
</body>
</html>
